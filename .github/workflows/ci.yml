name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcgiyim
          POSTGRES_PASSWORD: dcgiyim
          POSTGRES_DB: dcgiyim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dcgiyim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dcgiyim:dcgiyim@localhost:5432/dcgiyim_test
      TEST_DATABASE_URL: postgresql://dcgiyim:dcgiyim@localhost:5432/dcgiyim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dc-giyim-uretim .
